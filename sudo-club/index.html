<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sudo Club // Restricted</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ff41;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .gate-box {
      border: 2px solid #00ff41;
      padding: 35px;
      box-shadow: 0 0 15px #00ff41;
      background-color: #051405;
    }
    input {
      background-color: #000;
      color: #00ff41;
      border: 1px solid #00ff41;
      padding: 10px;
      font-family: inherit;
      font-size: 16px;
      margin-top: 15px;
      text-align: center;
    }
    button {
      background-color: #00ff41;
      color: #000;
      border: none;
      padding: 10px 25px;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #00cc33;
    }
  </style>
</head>
<body>

  <div class="gate-box">
    <h1>[ SUDO CLUB ]</h1>
    <p>ENTER SECRET ACCESS KEY:</p>
    <input type="password" id="secret-key" placeholder="Type key here..." autofocus>
    <br>
    <button onclick="unlockClub()">sudo enter</button>
  </div>

  <script>
    function unlockClub() {
      const key = document.getElementById("secret-key").value.trim();
      if (key !== "") {
        // Loads the secret HTML file matching whatever key they typed!
        window.location.href = key + ".html";
      }
    }

    // Allows pressing the Enter key to submit
    document.getElementById("secret-key").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        unlockClub();
      }
    });
  </script>

</body>
</html>
